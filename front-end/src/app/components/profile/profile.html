<div class="profile-main-container">
  <div class="sidebar">
    <div class="profile-section">
      <div class="profile-circle">L</div> <h3>Likhitha</h3>
    </div>
    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link">Contacts</a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-link">Settings</a>
      <a routerLink="/goals" routerLinkActive="active" class="nav-link">Goals</a>
      <a (click)="onLogout()" class="nav-link logout-btn">Logout</a>
    </nav>
  </div>

  <div class="profile-content-card">
    <h2 class="page-title">Profile</h2>

    <div class="photo-section">
      <div class="avatar-wrapper">
        
      </div>
    </div>

    <div class="form-container">
      <div class="input-group">
        <label>Full name</label>
        <input type="text" placeholder="Jane Doe">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="example@gmail.com">
      </div>

      <div class="input-group">
        <label>Phone number</label>
        <input type="tel" placeholder="+ xxxxxxxxxxx">
      </div>
    </div>

    <div class="section-divider"></div>
    <div class="linked-accounts">
      <h3>Linked Accounts</h3>
      <div class="button-row">
       
        <button class="btn btn-google">
          <span class="social-icon">G</span> Add google account
        </button>
      </div>
    </div>

    <div class="section-divider"></div>
    <div class="delete-section">
      <h3>Delete account</h3>
      <p>By deleting your account you will lose all your data.</p>
      <a href="#" class="delete-link">Delete my account</a>
    </div>

    <div class="footer-actions">
      <button class="btn-save">Update</button>
    </div>
  </div>
</div>
